name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keymap_drawer.yml"
      - "keymap_drawer.config.yaml"
      - "tools/split_keymap_svg.py"
      - "config/**"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@v0.23.0
    permissions:
      contents: write
    with:
      commit_message: "[Draw] ${{ github.event.head_commit.message }}"
      amend_commit: false
      install_branch: "v0.23.0"
      keymap_patterns: "config/*.keymap"
      json_path: "config"
      config_path: "keymap_drawer.config.yaml"
      output_folder: "keymap-drawer"
      destination: "both"
      parse_args: ""
      draw_args: ""

  split-layers:
    needs: draw
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Split combined SVG into per-layer files
        run: python3 tools/split_keymap_svg.py
      - name: Commit per-layer SVGs
        run: |
          if git diff --quiet -- keymap-drawer/layers && [ -z "$(git ls-files --others --exclude-standard -- keymap-drawer/layers)" ]; then
            echo "Per-layer SVGs already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keymap-drawer/layers
          git commit -m "[Draw] split keymap SVG into per-layer images"
          git push
